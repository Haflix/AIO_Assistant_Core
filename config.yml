general:
    hostname: ""
    plugin_package: plugins_test  # Base directory for plugins if path is omitted
    console_log_level: "DEBUG"
    file_log_level: "DEBUG"       # Log level written to file (DEBUG, INFO, WARNING, etc.)
    asyncio_debug: false           # Enable asyncio debug mode (tracks coroutine creation, slow callbacks)

    # Per-logger thresholds. String value = same level for both handlers; or use
    # explicit form { console: ..., file: ... } for an independent split.
    # Levels: DEBUG | INFO | WARNING | ERROR | CRITICAL | MUTE.
    # Match is by prefix with dot boundary, longest match wins.
    logger_levels:
        asyncio: "MUTE"
        urllib3: "MUTE"
        httpx: "WARNING"
        httpcore: "WARNING"
        psycopg: "WARNING"
        psycopg.pool: "WARNING"


networking:
    enabled: False
    node_ips: 
      - "172.23.0.12"
      - "172.23.0.18"
      - "172.23.0.24"
      - "172.23.0.98"
    port: 2510
    discover_nodes: True
    direct_discoverable: True
    auto_discoverable: True