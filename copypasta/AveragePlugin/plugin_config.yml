description: Example plugin demonstrating the AIO Assistant Core plugin structure
version: 1.1.0
remote: True  # Set to True if this plugin should be accessible remotely
arguments:  # Optional: Arguments passed during plugin loading

# Subscriptions: declarative event-router entries. Each subscription binds
# a topic pattern to a target endpoint (target_access_name). When the topic
# fires (via publish_event / request_event), the framework dispatches the
# event to the named endpoint. Topics use "/" as separator. Single-segment
# wildcard "*" is supported, e.g. "sensor/*/temperature".
subscriptions:
  handle_event_sub:
    topic: "example/event"
    target_access_name: handle_event
    hosts: "local"

endpoints:
  # Endpoints are a dict keyed by access_name (the name other plugins call).
  # `internal_name` is optional; if absent it defaults to the key.

  example_method:
    internal_name: example_method
    tags: []
    remote: True
    accessible_by_other_plugins: True
    description: Example method that doubles the input value and returns the result
    arguments:
      - name: value
        type: any
        description: Input value to process

  call_other_plugin:
    internal_name: call_other_plugin
    tags: []
    remote: True
    accessible_by_other_plugins: True
    description: Call another plugin's method by name and return its result
    arguments:
      - name: plugin_name
        type: str
        description: Name of the plugin to call
      - name: method_name
        type: str
        description: Method to execute on the target plugin
      - name: args
        type: any
        description: Arguments to pass to the method

  example_stream:
    internal_name: example_stream
    tags: []
    remote: True
    accessible_by_other_plugins: True
    description: Streaming method that yields sequential results
    arguments:
      - name: count
        type: int
        description: Number of items to yield

  # Topic-subscribed endpoint example (event system).
  # The matching `subscriptions.handle_event_sub` block above wires this
  # endpoint to the topic "example/event". When publish_event /
  # request_event fires for that topic, the framework dispatches the
  # Event object to handle_event(self, event).
  handle_event:
    internal_name: handle_event
    tags: []
    remote: True
    accessible_by_other_plugins: True
    description: Example endpoint subscribed to a topic via subscriptions block
    arguments:
      - name: event
        type: any
        description: Event object received from the topic (event.payload, event.topic, event.author, event.author_host)
