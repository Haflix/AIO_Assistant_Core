# Example configuration for Plexus.
# Copy this file to config.yml and edit it to match your local setup.
# config.yml is gitignored — your local edits stay private.

plugins:
  # Minimal example: a plugin with an explicit path.
  - name: MyPlugin
    enabled: true
    path: ./plugins/MyPlugin

  # Auto-resolve: no path — Plexus looks in plugin_package/AnotherPlugin.
  - name: AnotherPlugin
    enabled: false

  # Multi-instance: two entries pointing at the same path, different names.
  - name: WorkerA
    enabled: false
    path: ./plugins/MyWorker

  - name: WorkerB
    enabled: false
    path: ./plugins/MyWorker

  # Plugin with argument overrides.
  - name: MyConfiguredPlugin
    enabled: false
    path: ./plugins/MyConfiguredPlugin
    overrides:
      arguments:
        host: "localhost"
        port: 5432


general:
    hostname: ""                  # Empty = use system hostname
    plugin_package: plugins       # Base directory for plugins if path is omitted
    console_log_level: "INFO"
    file_log_level: "DEBUG"       # Log level written to file (DEBUG, INFO, WARNING, etc.)
    asyncio_debug: false          # Enable asyncio debug mode (tracks coroutine creation, slow callbacks)

    # Per-logger thresholds. String value = same level for both handlers; or use
    # explicit form { console: ..., file: ... } for an independent split.
    # Levels: DEBUG | INFO | WARNING | ERROR | CRITICAL | MUTE.
    # Match is by prefix with dot boundary, longest match wins.
    logger_levels:
        asyncio: "MUTE"


networking:
    enabled: false
    port: 2510
    discover_nodes: true
    direct_discoverable: true
    auto_discoverable: true
