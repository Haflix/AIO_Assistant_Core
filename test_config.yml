# Local-only test framework config — used by test_application.py.
# Enables only TestRunner + Phase 1 fixtures. Networking off (no peer node).
plugins:
  - name: TestRunner
    enabled: true
    path: ./plugins_test/TestRunner

  - name: TestExecuteSuite
    enabled: true
    path: ./plugins_test/TestExecuteSuite

  - name: TestExecuteTarget
    enabled: true
    path: ./plugins_test/TestExecuteTarget

  - name: TestExecuteTarget2          # multi-instance: same path, different name
    enabled: true
    path: ./plugins_test/TestExecuteTarget

  - name: TestStreamSuite
    enabled: true
    path: ./plugins_test/TestStreamSuite

  - name: TestStreamTarget
    enabled: true
    path: ./plugins_test/TestStreamTarget

  - name: TestNotifierSuite
    enabled: true
    path: ./plugins_test/TestNotifierSuite

  - name: TestNotifierTarget
    enabled: true
    path: ./plugins_test/TestNotifierTarget

  # TestNotifierBadActor is loaded on demand by the suite (§5.4 idiom);
  # config entry must exist so load_plugin_with_conf can find the path,
  # but enabled=false so it doesn't auto-load at startup.
  - name: TestNotifierBadActor
    enabled: false
    path: ./plugins_test/TestNotifierBadActor

  - name: TestLifecycleSuite
    enabled: true
    path: ./plugins_test/TestLifecycleSuite

  - name: TestLifecycleVictim
    enabled: true
    path: ./plugins_test/TestLifecycleVictim

  - name: TestLifecycleVictim2          # multi-instance for B-008 race
    enabled: true
    path: ./plugins_test/TestLifecycleVictim

  # B-007 fixtures (BrokenVersion + Sentinel) are NOT enabled in
  # test_config.yml because B-007 itself breaks startup — the KeyError from
  # the missing-version plugin aborts get_plugins's for loop, taking down
  # the entire test framework before any case runs. The B-007 case in
  # TestLifecycleSuite c.skip()s with a note that the bug requires a
  # controlled-startup harness (e.g. a separate subprocess invocation with
  # only these two plugins) to test.
  - name: TestLifecycleBrokenVersion
    enabled: false
    path: ./plugins_test/TestLifecycleBrokenVersion

  - name: TestLifecycleSentinel
    enabled: false
    path: ./plugins_test/TestLifecycleSentinel

  - name: TestRemoteSuite
    enabled: true
    path: ./plugins_test/TestRemoteSuite

  # TestRemoteTarget / Victim / Spoofer are loaded by the SUBPROCESS only
  # (plugins_test/_remote_node/config.subnode.yml). They are listed here so
  # config.example.yml stays discoverable, but enabled:false on the parent
  # so they don't load locally.
  - name: TestRemoteTarget
    enabled: false
    path: ./plugins_test/TestRemoteTarget

  - name: TestRemoteVictim
    enabled: false
    path: ./plugins_test/TestRemoteVictim

  - name: TestRemoteSpoofer
    enabled: false
    path: ./plugins_test/TestRemoteSpoofer


general:
    hostname: ""                      # Empty = use system hostname
    plugin_package: plugins_test
    console_log_level: "INFO"         # Quiet for cleaner test output
    file_log_level: "DEBUG"
    asyncio_debug: false

    logger_levels:
        asyncio: "MUTE"
        urllib3: "MUTE"
        httpx: "WARNING"
        httpcore: "WARNING"


networking:
    enabled: true                     # Phase 5 will spawn a localhost subnode on port 2511
    node_ips: ["127.0.0.1:2511"]
    port: 2510
    discover_nodes: true
    direct_discoverable: true
    auto_discoverable: true
    secret: "aio_test_secret_local"   # local-only test secret; forwarded to subnode
