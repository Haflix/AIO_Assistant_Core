description: Phase 5 suite — wire-bug repros (B-018/B-019/B-021/B-024/B-025/B-027/B-029/B-030/B-032/B-033) + Stage N (PR4) request_event coverage via subprocess peer
version: 0.4.0
remote: False
arguments:
events:
  r_hang:
    topic: "test/r/hang"
    hosts: "any"
  r_huge_stream:
    topic: "test/r/huge_stream"
    hosts: "any"
  # Stage N (PR4) — request_event / request_event_stream coverage
  r_request_basic:
    topic: "test/r/req_basic"
    hosts: "any"
  r_request_raise:
    topic: "test/r/req_raise"
    hosts: "any"
  r_request_stream_basic:
    topic: "test/r/req_stream_basic"
    hosts: "any"
  r_request_stream_raise:
    topic: "test/r/req_stream_raise"
    hosts: "any"
endpoints:
  run:
    internal_name: run
    tags:
    remote: False
    accessible_by_other_plugins: True
    description: Run the remote-suite cases (skips all if no peer subprocess)
    arguments:
      - name: category
        description: 'basic | edge | null (both)'
      - name: host
        description: 'local | remote | null (all hosts)'
      - name: case_ids
        description: Filter cases within the suite
      - name: bug_ids
        description: Filter cases by bug tag
      - name: skip_slow
        description: Skip cases tagged 'slow'
      - name: allow_destructive
        description: If False, destructive cases are skipped
