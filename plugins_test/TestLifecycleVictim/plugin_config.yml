description: Phase 4 fixture — controllable lifecycle victim with configurable on_enable / on_disable behaviors
version: 0.2.0
remote: True
arguments:
  level: "info"
  nested:
    a: 1
    b: 2
endpoints:
  configure:
    internal_name: configure
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Set behavioral flags on the victim
    arguments:
      - name: on_enable_raises_after_setup
      - name: on_disable_raises
      - name: on_disable_hangs_secs
      - name: on_enable_delay_secs

  get_state:
    internal_name: get_state
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Return current state (db_open, enable_count, disable_count)
    arguments:

  get_arguments:
    internal_name: get_arguments
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Return self.arguments (after override merge)
    arguments:

  victim_hang_endpoint:
    internal_name: victim_hang_endpoint
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Awaits asyncio.sleep(secs) — used to hold a pending request open for B-005
    arguments:
      - name: secs

  # B-073 Session 2 Step 5: inject_bad_request endpoint removed
  # alongside its plugin.py method. Was used by the deleted
  # B-006 running_loop test in TestLifecycleSuite.

  is_db_open:
    internal_name: is_db_open
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Return self.db_open
    arguments:

  cross_call_victim2:
    internal_name: cross_call_victim2
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async; calls execute("TestLifecycleVictim2", "is_db_open") — used during on_enable for B-008
    arguments:
