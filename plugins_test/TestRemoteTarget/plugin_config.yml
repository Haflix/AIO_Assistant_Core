description: Phase 5 fixture — remote=True endpoints + topic handlers used by TestRemoteSuite cases
version: 0.3.1
remote: True
arguments:
subscriptions:
  huge_stream_sub:
    topic: "test/r/huge_stream"
    target_access_name: r_topic_huge_stream
    hosts: "local"
  open_sub:
    topic: "test/r/open"
    target_access_name: r_topic_open
    hosts: "local"
endpoints:
  r_open:
    internal_name: r_open
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Plain remote-callable endpoint
    arguments:
      - name: value

  r_async_gen:
    internal_name: r_async_gen
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async generator yielding N items
    arguments:
      - name: n

  r_async_gen_huge_item:
    internal_name: r_async_gen_huge_item
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async gen yielding one huge bytes item (B-024)
    arguments:
      - name: size_mb

  r_topic_huge_stream:
    internal_name: r_topic_huge_stream
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async gen subscribed to test/r/huge_stream (via subscriptions block) — yields one bytes item bigger than CHUNK_SIZE for B-024 via request_event_stream
    arguments:

  r_async_gen_raises_after:
    internal_name: r_async_gen_raises_after
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async gen yielding N items then raising
    arguments:
      - name: n_yielded

  r_topic_open:
    internal_name: r_topic_open
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Config-driven topic handler subscribed to test/r/open (via subscriptions block)
    arguments:
      - name: event

  r_hang_topic_handler:
    internal_name: r_hang_topic_handler
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Hang handler subscribed at runtime to test/r/hang (B-020 + Stage N timeout-honored driver)
    arguments:
      - name: event

  r_request_basic_handler:
    internal_name: r_request_basic_handler
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Stage N (PR4) — happy-path request_event handler subscribed at runtime to test/r/req_basic; echoes payload back
    arguments:
      - name: event

  r_request_raise_handler:
    internal_name: r_request_raise_handler
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Stage N (PR4) — request_event handler subscribed at runtime to test/r/req_raise; raises ValueError with marker
    arguments:
      - name: event

  r_request_stream_basic_handler:
    internal_name: r_request_stream_basic_handler
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Stage N (PR4) — request_event_stream async-gen handler subscribed at runtime to test/r/req_stream_basic; yields 3 chunks
    arguments:
      - name: event

  r_request_stream_raise_handler:
    internal_name: r_request_stream_raise_handler
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Stage N (PR4) — request_event_stream handler subscribed at runtime to test/r/req_stream_raise; yields 2 chunks then raises ValueError with marker
    arguments:
      - name: event
