description: Phase 5 fixture — remote=True endpoints + streaming generators for wire-bug repros
version: 0.2.0
remote: True
arguments:
subscriptions:
  huge_stream_sub:
    topic: "test/r/huge_stream"
    target_access_name: r_topic_huge_stream
    hosts: "local"
  open_sub:
    topic: "test/r/open"
    target_access_name: r_topic_open
    hosts: "local"
endpoints:
  r_open:
    internal_name: r_open
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Plain remote-callable endpoint
    arguments:
      - name: value

  r_remote_only:
    internal_name: r_remote_only
    tags:
    remote: True
    accessible_by_other_plugins: False
    description: remote=True but accessible_by_other_plugins=False
    arguments:
      - name: value

  r_async_gen:
    internal_name: r_async_gen
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async generator yielding N items
    arguments:
      - name: n

  r_async_gen_huge_item:
    internal_name: r_async_gen_huge_item
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async gen yielding one huge bytes item (B-024)
    arguments:
      - name: size_mb

  r_topic_huge_stream:
    internal_name: r_topic_huge_stream
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async gen subscribed to test/r/huge_stream (via subscriptions block) — yields one bytes item bigger than CHUNK_SIZE for B-024 via request_event_stream
    arguments:

  r_async_gen_raises_after:
    internal_name: r_async_gen_raises_after
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async gen yielding N items then raising (B-025 driver)
    arguments:
      - name: n_yielded

  r_hang:
    internal_name: r_hang
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Awaits asyncio.Event().wait() forever (B-028 driver)
    arguments:

  r_topic_open:
    internal_name: r_topic_open
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Config-driven topic handler subscribed to test/r/open (via subscriptions block)
    arguments:
      - name: event

  r_hang_topic_handler:
    internal_name: r_hang_topic_handler
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: B-020 hang handler subscribed at runtime to test/r/hang
    arguments:
      - name: event
