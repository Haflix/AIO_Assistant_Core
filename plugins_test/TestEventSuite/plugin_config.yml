description: PR3 event API suite — smoke-level publish_event / request_event verification (Stage E expands to full PLAN J)
version: "0.1.0"
remote: false
arguments:
events:
  smoke_publish:
    topic: "test_event/smoke/publish"
    hosts: "local"
  smoke_request:
    topic: "test_event/smoke/request"
    hosts: "local"
subscriptions:
  smoke_publish_sub:
    topic: "test_event/smoke/publish"
    target_access_name: handle_smoke_publish
    hosts: "local"
  smoke_request_sub:
    topic: "test_event/smoke/request"
    target_access_name: handle_smoke_request
    hosts: "local"
endpoints:
  run:
    internal_name: run
    tags:
    remote: false
    accessible_by_other_plugins: true
    description: Run the event-suite smoke cases and return a structured suite result dict
    arguments:
      - name: category
        description: 'basic | edge | null (both)'
      - name: host
        description: 'local | remote | null'
      - name: case_ids
        description: Filter cases within the suite
      - name: bug_ids
        description: Filter cases by bug tag
      - name: skip_slow
      - name: allow_destructive
  handle_smoke_publish:
    internal_name: handle_smoke_publish
    remote: false
    accessible_by_other_plugins: true
    description: Subscriber endpoint for smoke_publish event — records payload and metadata
    arguments:
      - name: event
  handle_smoke_request:
    internal_name: handle_smoke_request
    remote: false
    accessible_by_other_plugins: true
    description: Subscriber endpoint for smoke_request event — echoes payload back
    arguments:
      - name: event
