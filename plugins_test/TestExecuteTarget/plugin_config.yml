description: Phase 1 fixture providing predictable sync/async/error endpoints for TestExecuteSuite
version: 0.1.0
remote: True
arguments:
endpoints:
  ea_add:
    internal_name: ea_add
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async add a + b
    arguments:
      - name: a
      - name: b

  es_add:
    internal_name: es_add
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Sync add a + b
    arguments:
      - name: a
      - name: b

  ea_no_args:
    internal_name: ea_no_args
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async with no args, returns "ok"
    arguments:

  es_no_args:
    internal_name: es_no_args
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Sync with no args, returns "ok"
    arguments:

  ea_kwargs_only:
    internal_name: ea_kwargs_only
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async kwargs-only function
    arguments:
      - name: name
      - name: value

  ea_positional_only:
    internal_name: ea_positional_only
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async positional-only function
    arguments:
      - name: a
      - name: b

  ea_raises:
    internal_name: ea_raises
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async, raises ValueError("intentional")
    arguments:

  es_raises:
    internal_name: es_raises
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Sync, raises ValueError("intentional")
    arguments:

  ea_raises_request_exc:
    internal_name: ea_raises_request_exc
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async, raises RequestException("specific")
    arguments:

  ea_returns_none:
    internal_name: ea_returns_none
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async, returns None
    arguments:

  ea_returns_future:
    internal_name: ea_returns_future
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async, returns a successfully-resolved Future
    arguments:

  ea_returns_failing_future:
    internal_name: ea_returns_failing_future
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async, returns a Future whose await raises (B-013 trigger)
    arguments:

  ea_hang:
    internal_name: ea_hang
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async, awaits asyncio.sleep(seconds)
    arguments:
      - name: seconds

  ea_private:
    internal_name: ea_private
    tags:
    remote: True
    accessible_by_other_plugins: False
    description: Async, accessible_by_other_plugins=False (B-017 boundary)
    arguments:
      - name: value

  ea_self_call:
    internal_name: ea_self_call
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async; calls self.execute("TestExecuteTarget", target_method, plugin_uuid=plugin_uuid). Default plugin_uuid pins to self for multi-instance correctness.
    arguments:
      - name: target_method
      - name: target_args
      - name: plugin_uuid

  ea_large_return:
    internal_name: ea_large_return
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async; returns bytes of the requested size for in-process payload sanity
    arguments:
      - name: size_bytes

  ea_returns_arg:
    internal_name: ea_returns_arg
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async; returns whatever single positional argument it received (used to detect silent contract violations like B-015)
    arguments:
      - name: x

  ea_chain_step:
    internal_name: ea_chain_step
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async; calls another endpoint at depth-N to test deep error propagation
    arguments:
      - name: depth
      - name: target_method

  get_uuid:
    internal_name: get_uuid
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Returns this instance's plugin_uuid (multi-instance smoke aid)
    arguments:
