description: Phase 3 fixture providing config-driven topics + readback endpoints for TestNotifierSuite
version: 0.1.0
remote: True
arguments:
endpoints:
  n_handle_greet:
    internal_name: n_handle_greet
    tags:
    remote: True
    accessible_by_other_plugins: True
    topic: test/greet
    description: Records greet calls; returns "Hello, {name}!"
    arguments:
      - name: name

  n_handle_math:
    internal_name: n_handle_math
    tags:
    remote: True
    accessible_by_other_plugins: True
    topic: test/math/add
    description: Returns a + b
    arguments:
      - name: a
      - name: b

  n_handle_wild_a:
    internal_name: n_handle_wild_a
    tags:
    remote: True
    accessible_by_other_plugins: True
    topic: test/wild/*
    description: Wildcard handler A — pattern test/wild/*
    arguments:

  n_handle_wild_b:
    internal_name: n_handle_wild_b
    tags:
    remote: True
    accessible_by_other_plugins: True
    topic: test/*/end
    description: Wildcard handler B — pattern test/*/end
    arguments:

  n_handle_priv:
    internal_name: n_handle_priv
    tags:
    remote: False
    accessible_by_other_plugins: False
    topic: test/priv
    description: Private endpoint subscribed to test/priv (B-017 boundary)
    arguments:
      - name: data

  n_handle_count:
    internal_name: n_handle_count
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Counter handler used as a code-driven sub on test/count
    arguments:
      - name: payload

  n_handle_async_gen:
    internal_name: n_handle_async_gen
    tags:
    remote: True
    accessible_by_other_plugins: True
    topic: test/stream
    description: Async generator handler subscribed to test/stream
    arguments:
      - name: n

  n_handle_sync_gen:
    internal_name: n_handle_sync_gen
    tags:
    remote: True
    accessible_by_other_plugins: True
    topic: test/sync_stream
    description: Sync generator handler subscribed to test/sync_stream
    arguments:
      - name: n

  trigger_topic_hop:
    internal_name: trigger_topic_hop
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Sync; calls request_topic_sync("topic/hop") to trigger B-039 chain observation
    arguments:

  topic_hop_observer:
    internal_name: topic_hop_observer
    tags:
    remote: True
    accessible_by_other_plugins: True
    topic: topic/hop
    description: Sync handler subscribed to topic/hop; records observed _sync_call_chain.chain on entry
    arguments:

  trigger_self_publish:
    internal_name: trigger_self_publish
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Async; calls self.notify("test/self") from inside the same plugin
    arguments:

  self_publish_handler:
    internal_name: self_publish_handler
    tags:
    remote: True
    accessible_by_other_plugins: True
    topic: test/self
    description: Increments self.self_publish_count
    arguments:

  get_event_log:
    internal_name: get_event_log
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Returns the event log
    arguments:

  reset_event_log:
    internal_name: reset_event_log
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Resets the event log
    arguments:

  get_count:
    internal_name: get_count
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Returns count_handler invocations
    arguments:

  get_self_publish_count:
    internal_name: get_self_publish_count
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Returns self_publish handler invocations
    arguments:

  get_observed_chain:
    internal_name: get_observed_chain
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Returns the chain observed by topic_hop_observer
    arguments:

  notify_with_own_author:
    internal_name: notify_with_own_author
    tags:
    remote: True
    accessible_by_other_plugins: True
    description: Calls self.notify(topic) — author_id = own plugin_uuid (used to test self-publish access)
    arguments:
      - name: topic
      - name: args
