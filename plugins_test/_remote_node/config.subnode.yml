# Minimal config for the Phase 5 subprocess (run_node.py).
# Loads only the TestRemote* fixtures; no plugins from the parent's main config.
plugins:
  - name: TestRemoteTarget
    enabled: true
    path: ./plugins_test/TestRemoteTarget

  - name: TestRemoteVictim
    enabled: true
    path: ./plugins_test/TestRemoteVictim

general:
    hostname: "test-subnode"           # MUST differ from parent hostname
    plugin_package: plugins_test
    console_log_level: "WARNING"       # Quiet sub-process console
    file_log_level: "DEBUG"
    asyncio_debug: false
    logger_levels:
        asyncio: "MUTE"
        urllib3: "MUTE"

networking:
    # PR4 Stage K (B-066): TestRemoteSuite spawns this subnode via
    # run_node.py. The parent injects --keys-dir + --parent-cert-pem-file
    # at runtime so this file does NOT carry the legacy node_ips entries.
    # If TestRemoteSuite is updated to bring up mTLS for the subnode, it
    # MUST pass those flags. Without them, networking starts with empty
    # peers and refuses to start (hard error in start()).
    enabled: true
    port: 0                             # overridden via run_node.py --port
    discover_nodes: true
    direct_discoverable: true
    auto_discoverable: true
