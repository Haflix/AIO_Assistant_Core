# Minimal config for the Phase 5 subprocess (run_node.py).
# Loads only the TestRemote* fixtures; no plugins from the parent's main config.
plugins:
  - name: TestRemoteTarget
    enabled: true
    path: ./plugins_test/TestRemoteTarget

  - name: TestRemoteVictim
    enabled: true
    path: ./plugins_test/TestRemoteVictim

  - name: TestRemoteSpoofer
    enabled: true
    path: ./plugins_test/TestRemoteSpoofer

general:
    hostname: "test-subnode"           # MUST differ from parent hostname
    plugin_package: plugins_test
    console_log_level: "WARNING"       # Quiet sub-process console
    file_log_level: "DEBUG"
    asyncio_debug: false
    logger_levels:
        asyncio: "MUTE"
        urllib3: "MUTE"

networking:
    enabled: true
    # Parent's listener port — required so the subnode connects to the parent
    # rather than its own listener (which would happen with bare "127.0.0.1").
    # The suite passes the parent's port explicitly; default 2510 here.
    node_ips: ["127.0.0.1:2510"]
    port: 0                             # overridden via run_node.py --port
    discover_nodes: true
    direct_discoverable: true
    auto_discoverable: true
    # secret is read from the NETWORKING_SECRET env var which run_node.py
    # forwards from the parent process. No literal secret in this config.
